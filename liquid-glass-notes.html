<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Notes</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* ── Animated gradient background ── */
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33%       { transform: translateY(-18px) rotate(2deg); }
      66%       { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-24px) rotate(-3deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(139,92,246,0.4), 0 0 60px rgba(59,130,246,0.2); }
      50%       { box-shadow: 0 0 40px rgba(139,92,246,0.7), 0 0 100px rgba(59,130,246,0.4); }
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%) skewX(-12deg); }
      100% { transform: translateX(200%) skewX(-12deg); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes ripple {
      0%   { transform: scale(0); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
    @keyframes blobPulse {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      25%       { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      50%       { border-radius: 50% 60% 30% 70% / 40% 70% 50% 40%; }
      75%       { border-radius: 70% 30% 60% 40% / 60% 40% 70% 30%; }
    }

    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    .app-bg {
      position: fixed; inset: 0;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0a0a2e, #1a0533, #0d1b4b);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      overflow: hidden;
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      animation: blobPulse 8s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #7c3aed, #3b0764); top: -180px; left: -120px; animation-duration: 9s; animation: blobPulse 9s ease-in-out infinite, float 12s ease-in-out infinite; }
    .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #2563eb, #1e1b4b); bottom: -140px; right: -80px; animation-duration: 11s; animation: blobPulse 11s ease-in-out infinite, float2 15s ease-in-out infinite; }
    .orb-3 { width: 260px; height: 260px; background: radial-gradient(circle, #ec4899, #7c3aed); top: 40%; right: 15%; animation-duration: 7s; animation: blobPulse 7s ease-in-out infinite, float 10s ease-in-out infinite 2s; }
    .orb-4 { width: 200px; height: 200px; background: radial-gradient(circle, #06b6d4, #2563eb); top: 20%; left: 30%; animation: blobPulse 13s ease-in-out infinite, float2 14s ease-in-out infinite 1s; }

    /* Liquid glass panel */
    .glass {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        inset 0 -1px 0 rgba(0,0,0,0.1),
        0 8px 32px rgba(0,0,0,0.4),
        0 2px 8px rgba(0,0,0,0.2);
    }
    .glass-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 4px 20px rgba(0,0,0,0.35);
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transition: left 0.5s ease;
      pointer-events: none;
    }
    .glass-card:hover::before { left: 200%; animation: shimmer 0.6s ease; }
    .glass-card:hover {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.25);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.25),
        0 8px 32px rgba(0,0,0,0.5),
        0 0 0 1px rgba(139,92,246,0.3);
      transform: translateY(-2px) scale(1.01);
    }
    .glass-card.active {
      background: rgba(139,92,246,0.18);
      border-color: rgba(139,92,246,0.5);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 8px 32px rgba(0,0,0,0.5),
        0 0 0 1px rgba(139,92,246,0.5),
        0 0 20px rgba(139,92,246,0.2);
    }

    /* Shimmer button */
    .btn-glass {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .btn-glass:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .btn-glass:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, rgba(139,92,246,0.8), rgba(59,130,246,0.8));
      border: 1px solid rgba(139,92,246,0.5);
      color: white;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(124,58,237,0.9), rgba(37,99,235,0.9));
      box-shadow: 0 6px 28px rgba(139,92,246,0.6);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: scale(0.97); }

    /* Textarea & input */
    .glass-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      outline: none;
      transition: all 0.3s ease;
      width: 100%;
    }
    .glass-input:focus {
      background: rgba(255,255,255,0.09);
      border-color: rgba(139,92,246,0.6);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .glass-input::placeholder { color: rgba(255,255,255,0.3); }

    /* Note card colors */
    .accent-purple { --accent: rgba(139,92,246,0.3); }
    .accent-blue   { --accent: rgba(59,130,246,0.3); }
    .accent-pink   { --accent: rgba(236,72,153,0.3); }
    .accent-teal   { --accent: rgba(20,184,166,0.3); }
    .accent-amber  { --accent: rgba(245,158,11,0.3); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    /* Layout */
    .layout {
      display: flex;
      height: 100vh;
      padding: 20px;
      gap: 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    /* Notes list */
    .notes-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    /* Editor */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    /* Note card animation */
    .note-item {
      animation: slideIn 0.3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    /* Tag pill */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Delete button */
    .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .glass-card:hover .delete-btn { opacity: 1; }

    /* Color picker */
    .color-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }
    .color-dot:hover { transform: scale(1.25); }
    .color-dot.selected { border-color: white; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }

    /* Toolbar icons */
    .toolbar-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .toolbar-btn:hover {
      background: rgba(255,255,255,0.12);
      color: white;
    }
    .toolbar-btn.active {
      background: rgba(139,92,246,0.3);
      color: white;
    }

    /* Search */
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      pointer-events: none;
    }
    .search-input {
      padding-left: 38px;
    }

    /* Stats bar */
    .stats {
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stats span { display: flex; align-items: center; gap: 4px; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(255,255,255,0.25);
    }

    /* Pinned indicator */
    .pin-icon {
      color: rgba(245,158,11,0.8);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(139,92,246,0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 500;
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s;
      opacity: 0;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Liquid ripple on click */
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      pointer-events: none;
      animation: ripple 0.6s linear;
    }
  </style>
</head>
<body style="margin:0;padding:0;overflow:hidden;">

<!-- Background -->
<div class="app-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<!-- Layout -->
<div class="layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">

    <!-- Logo / Header -->
    <div class="glass rounded-2xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div style="width:32px;height:32px;background:linear-gradient(135deg,#7c3aed,#2563eb);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(124,58,237,0.5);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <div>
          <div style="color:rgba(255,255,255,0.95);font-weight:700;font-size:15px;letter-spacing:-0.3px;">LiquidNotes</div>
          <div style="color:rgba(255,255,255,0.35);font-size:11px;">Your thoughts, fluid.</div>
        </div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input id="searchInput" type="text" placeholder="Search notes…"
        class="glass-input glass-input search-input rounded-xl px-3 py-2 text-sm"
        style="font-size:13px;"
        oninput="filterNotes(this.value)" />
    </div>

    <!-- New note button -->
    <button class="btn-primary rounded-xl px-4 py-2.5 text-sm font-semibold flex items-center justify-center gap-2 w-full"
      onclick="createNote()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Note
    </button>

    <!-- Notes count -->
    <div class="stats px-1" id="statsBar">
      <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> <span id="noteCount">0 notes</span></span>
      <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> <span id="pinnedCount">0 pinned</span></span>
    </div>

    <!-- Notes list -->
    <div class="notes-list" id="notesList"></div>

    <!-- Footer -->
    <div style="color:rgba(255,255,255,0.2);font-size:11px;text-align:center;padding:4px 0;">
      Auto-saved · End-to-end gorgeous
    </div>

  </aside>

  <!-- ── EDITOR ── -->
  <main class="editor-panel">

    <!-- Toolbar -->
    <div class="glass rounded-2xl px-4 py-2 flex items-center gap-2" id="toolbar" style="display:none!important;">
      <!-- Color picker -->
      <div class="flex items-center gap-1.5 pr-3" style="border-right:1px solid rgba(255,255,255,0.12);">
        <div class="color-dot selected" style="background:linear-gradient(135deg,#7c3aed,#3b82f6);" data-color="purple" onclick="setNoteColor('purple', this)" title="Purple"></div>
        <div class="color-dot" style="background:linear-gradient(135deg,#2563eb,#06b6d4);" data-color="blue" onclick="setNoteColor('blue', this)" title="Blue"></div>
        <div class="color-dot" style="background:linear-gradient(135deg,#ec4899,#f43f5e);" data-color="pink" onclick="setNoteColor('pink', this)" title="Pink"></div>
        <div class="color-dot" style="background:linear-gradient(135deg,#14b8a6,#10b981);" data-color="teal" onclick="setNoteColor('teal', this)" title="Teal"></div>
        <div class="color-dot" style="background:linear-gradient(135deg,#f59e0b,#ef4444);" data-color="amber" onclick="setNoteColor('amber', this)" title="Amber"></div>
      </div>

      <!-- Format buttons -->
      <div class="flex items-center gap-0.5 pr-3" style="border-right:1px solid rgba(255,255,255,0.12);">
        <button class="toolbar-btn" onclick="formatText('bold')" title="Bold"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg></button>
        <button class="toolbar-btn" onclick="formatText('italic')" title="Italic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
        <button class="toolbar-btn" onclick="formatText('underline')" title="Underline"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg></button>
      </div>

      <!-- Pin button -->
      <button class="toolbar-btn" id="pinBtn" onclick="togglePin()" title="Pin note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>

      <!-- Spacer -->
      <div style="flex:1;"></div>

      <!-- Word count -->
      <div class="stats">
        <span id="wordCountDisplay">0 words</span>
      </div>

      <!-- Delete button -->
      <button class="toolbar-btn" onclick="deleteCurrentNote()" title="Delete note" style="color:rgba(248,113,113,0.7);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>

    <!-- Title input -->
    <div id="titleWrap" style="display:none;">
      <input id="noteTitle" type="text" placeholder="Note title…"
        class="glass glass-input rounded-2xl px-5 py-3 w-full"
        style="font-size:22px;font-weight:700;color:rgba(255,255,255,0.95);letter-spacing:-0.5px;box-sizing:border-box;"
        oninput="autoSave()" />
    </div>

    <!-- Content editor -->
    <div id="editorWrap" style="display:none;flex:1;overflow:hidden;">
      <div id="noteContent" contenteditable="true"
        data-placeholder="Start writing your thoughts here…"
        class="glass rounded-2xl px-5 py-5"
        style="height:100%;overflow-y:auto;color:rgba(255,255,255,0.88);font-size:15px;line-height:1.75;outline:none;box-sizing:border-box;caret-color:#a78bfa;"
        oninput="autoSave(); updateWordCount();">
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div style="width:80px;height:80px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:28px;display:flex;align-items:center;justify-content:center;animation:float 6s ease-in-out infinite;">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </div>
      <div style="text-align:center;">
        <div style="font-size:16px;font-weight:600;color:rgba(255,255,255,0.3);margin-bottom:6px;">No note selected</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.18);">Create a new note or pick one from the list</div>
      </div>
      <button class="btn-primary rounded-xl px-5 py-2.5 text-sm font-semibold flex items-center gap-2" onclick="createNote()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create your first note
      </button>
    </div>

  </main>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Placeholder CSS for contenteditable -->
<style>
  #noteContent:empty:before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.22);
    pointer-events: none;
    display: block;
  }
</style>

<script>
  // ── State ──────────────────────────────────────────────────────────
  let notes = JSON.parse(localStorage.getItem('liquidNotes') || '[]');
  let activeId = null;
  let saveTimer = null;
  let searchQuery = '';

  const COLORS = {
    purple: { bg: 'rgba(124,58,237,0.18)', border: 'rgba(124,58,237,0.45)', dot: 'linear-gradient(135deg,#7c3aed,#3b82f6)', tag: '#7c3aed' },
    blue:   { bg: 'rgba(37,99,235,0.18)',  border: 'rgba(37,99,235,0.45)',  dot: 'linear-gradient(135deg,#2563eb,#06b6d4)', tag: '#2563eb' },
    pink:   { bg: 'rgba(236,72,153,0.18)', border: 'rgba(236,72,153,0.45)', dot: 'linear-gradient(135deg,#ec4899,#f43f5e)', tag: '#ec4899' },
    teal:   { bg: 'rgba(20,184,166,0.18)', border: 'rgba(20,184,166,0.45)', dot: 'linear-gradient(135deg,#14b8a6,#10b981)', tag: '#14b8a6' },
    amber:  { bg: 'rgba(245,158,11,0.18)', border: 'rgba(245,158,11,0.45)', dot: 'linear-gradient(135deg,#f59e0b,#ef4444)', tag: '#f59e0b' },
  };

  // ── Helpers ────────────────────────────────────────────────────────
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function now() { return new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}); }
  function save() { localStorage.setItem('liquidNotes', JSON.stringify(notes)); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ── Note CRUD ──────────────────────────────────────────────────────
  function createNote() {
    const note = { id: uid(), title: '', content: '', color: 'purple', pinned: false, created: now(), updated: now() };
    notes.unshift(note);
    save();
    renderSidebar();
    selectNote(note.id);
    document.getElementById('noteTitle').focus();
    showToast('✨ New note created');
  }

  function selectNote(id) {
    activeId = id;
    const note = notes.find(n => n.id === id);
    if (!note) return;

    // Show editor
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('toolbar').style.setProperty('display', 'flex', 'important');
    document.getElementById('titleWrap').style.display = 'block';
    document.getElementById('editorWrap').style.display = 'flex';

    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').innerHTML = note.content;

    // Sync color picker
    document.querySelectorAll('.color-dot').forEach(d => {
      d.classList.toggle('selected', d.dataset.color === note.color);
    });

    // Pin button
    updatePinBtn(note.pinned);

    updateWordCount();
    renderSidebar();
  }

  function getActiveNote() { return notes.find(n => n.id === activeId); }

  function autoSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const note = getActiveNote();
      if (!note) return;
      note.title   = document.getElementById('noteTitle').value;
      note.content = document.getElementById('noteContent').innerHTML;
      note.updated = now();
      save();
      renderSidebar();
    }, 350);
  }

  function deleteCurrentNote() {
    if (!activeId) return;
    notes = notes.filter(n => n.id !== activeId);
    activeId = null;
    save();
    showEditor(false);
    renderSidebar();
    showToast('🗑 Note deleted');
  }

  function deleteNote(id, e) {
    e.stopPropagation();
    notes = notes.filter(n => n.id !== id);
    if (activeId === id) { activeId = null; showEditor(false); }
    save();
    renderSidebar();
    showToast('🗑 Note deleted');
  }

  function togglePin() {
    const note = getActiveNote();
    if (!note) return;
    note.pinned = !note.pinned;
    updatePinBtn(note.pinned);
    save();
    renderSidebar();
    showToast(note.pinned ? '📌 Note pinned' : 'Unpinned');
  }

  function updatePinBtn(pinned) {
    const btn = document.getElementById('pinBtn');
    btn.classList.toggle('active', pinned);
    btn.title = pinned ? 'Unpin note' : 'Pin note';
  }

  function setNoteColor(color, el) {
    const note = getActiveNote();
    if (!note) return;
    note.color = color;
    save();
    renderSidebar();
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
    showToast('🎨 Color updated');
  }

  function showEditor(show) {
    document.getElementById('emptyState').style.display = show ? 'none' : 'flex';
    document.getElementById('toolbar').style.setProperty('display', show ? 'flex' : 'none', 'important');
    document.getElementById('titleWrap').style.display = show ? 'block' : 'none';
    document.getElementById('editorWrap').style.display = show ? 'flex' : 'none';
  }

  // ── Format ─────────────────────────────────────────────────────────
  function formatText(cmd) { document.execCommand(cmd, false, null); document.getElementById('noteContent').focus(); }

  function updateWordCount() {
    const text = document.getElementById('noteContent').innerText || '';
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('wordCountDisplay').textContent = words + (words === 1 ? ' word' : ' words');
  }

  // ── Render sidebar ─────────────────────────────────────────────────
  function renderSidebar() {
    const list = document.getElementById('notesList');
    let filtered = notes;

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = notes.filter(n =>
        n.title.toLowerCase().includes(q) ||
        (n.content.replace(/<[^>]*>/g,'').toLowerCase().includes(q))
      );
    }

    // Pinned first
    filtered = [
      ...filtered.filter(n => n.pinned),
      ...filtered.filter(n => !n.pinned),
    ];

    const pinned = notes.filter(n => n.pinned).length;
    document.getElementById('noteCount').textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
    document.getElementById('pinnedCount').textContent = pinned + ' pinned';

    if (filtered.length === 0) {
      list.innerHTML = `<div style="color:rgba(255,255,255,0.2);font-size:13px;text-align:center;padding:24px 0;">${searchQuery ? 'No results found' : 'No notes yet'}</div>`;
      return;
    }

    list.innerHTML = filtered.map((note, i) => {
      const c = COLORS[note.color] || COLORS.purple;
      const preview = note.content.replace(/<[^>]*>/g, '').slice(0, 80) || 'No content yet…';
      const title = note.title || 'Untitled note';
      const isActive = note.id === activeId;
      return `
        <div class="glass-card note-item rounded-xl p-3 ${isActive ? 'active' : ''}"
          style="animation-delay:${i * 0.04}s;${isActive ? `background:${c.bg};border-color:${c.border};` : ''}"
          onclick="selectNote('${note.id}')">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                ${note.pinned ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="${c.border}" stroke="${c.border}" stroke-width="2" class="pin-icon" style="flex-shrink:0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>` : ''}
                <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(title)}</div>
              </div>
              <div style="font-size:12px;color:rgba(255,255,255,0.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;">${escHtml(preview)}</div>
              <div style="font-size:11px;color:rgba(255,255,255,0.22);margin-top:6px;">${note.updated}</div>
            </div>
            <button class="delete-btn btn-glass rounded-lg" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;border-radius:8px;"
              onclick="deleteNote('${note.id}', event)" title="Delete">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="rgba(248,113,113,0.8)" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div style="margin-top:8px;height:2px;border-radius:99px;background:linear-gradient(90deg,${c.border},transparent);opacity:0.6;"></div>
        </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function filterNotes(q) { searchQuery = q; renderSidebar(); }

  // ── Keyboard shortcuts ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); createNote(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'p') { e.preventDefault(); if (activeId) togglePin(); }
  });

  // ── Ripple effect ─────────────────────────────────────────────────
  document.addEventListener('click', e => {
    const target = e.currentTarget;
    if (e.target.closest('.glass-card') || e.target.closest('.btn-primary') || e.target.closest('.btn-glass')) {
      const el = e.target.closest('.glass-card') || e.target.closest('.btn-primary') || e.target.closest('.btn-glass');
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple-effect';
      ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;`;
      el.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }
  });

  // ── Init ───────────────────────────────────────────────────────────
  function init() {
    // Seed demo notes if empty
    if (notes.length === 0) {
      notes = [
        {
          id: uid(),
          title: 'Welcome to LiquidNotes 🌊',
          content: `<p>This is your <strong>stunning glass notes app</strong>. Enjoy the flowing, liquid aesthetic while you capture your thoughts.</p><br><p>✨ <em>Create</em> notes with the + button</p><p>🎨 <em>Colorize</em> them with the color dots above</p><p>📌 <em>Pin</em> important notes to keep them at the top</p><p>🔍 <em>Search</em> across all your notes instantly</p>`,
          color: 'purple',
          pinned: true,
          created: now(),
          updated: now(),
        },
        {
          id: uid(),
          title: 'Ideas for the weekend',
          content: `<p>- Visit the art gallery downtown</p><p>- Try that new ramen place</p><p>- Read <em>The Midnight Library</em></p><p>- Go for a sunset hike</p>`,
          color: 'teal',
          pinned: false,
          created: now(),
          updated: now(),
        },
        {
          id: uid(),
          title: 'Meeting notes – Oct 25',
          content: `<p><strong>Attendees:</strong> Alice, Bob, Carol</p><br><p>Action items:</p><p>• Finalize Q4 roadmap by Friday</p><p>• Schedule design review</p><p>• Update stakeholder deck</p>`,
          color: 'blue',
          pinned: false,
          created: now(),
          updated: now(),
        },
      ];
      save();
    }
    renderSidebar();
    showEditor(false);
  }

  init();
</script>

</body>
</html>
